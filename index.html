<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Veendam Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/n.css

<style>
body {
    margin:0;
    background:#0d1117;
    color:#c9d1d9;
    font-family:Segoe UI, Arial, sans-serif;
}

.header {
    background:#161b22;
    border-bottom:1px solid #30363d;
    padding:15px;
    text-align:center;
}

.card-dark {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:15px;
    height:80vh;
}

.big-clock {
    font-size:120px;
    font-weight:bold;
}

.big-date {
    font-size:40px;
}

.carousel-item {
    padding:30px;
}

.slide-content {
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}
</style>
</head>
<body>

<div class="header">
    <h1>🚨 Veendam Operations Dashboard</h1>
</div>

<div id="dashboardCarousel"
     class="carousel slide"
     data-bs-ride="carousel"
     data-bs-interval="10000">

    <div class="carousel-inner">

        <!-- Klok -->
        <div class="carousel-item active">
            <div class="card card-dark">
                <div class="slide-content">
                    <div class="big-clock" id="clock"></div>
                    <div class="big-date" id="date"></div>
                </div>
            </div>
        </div>

        <!-- Weer Veendam -->
        <div class="carousel-item">
            <div class="card card-dark">
                <div class="slide-content">
                    <h2>🌦 Weer Veendam</h2>
                    <div id="weather-veendam">
                        Gegevens laden...
                    </div>
                </div>
            </div>
        </div>

        <!-- Weer Groningen -->
        <div class="carousel-item">
            <div class="card card-dark">
                <div class="slide-content">
                    <h2>🌤 Weer Groningen</h2>
                    <div id="weather-groningen">
                        Gegevens laden...
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.jsscript>

<script>

function updateClock() {

    const now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleTimeString("nl-NL");

    document.getElementById("date").innerText =
        now.toLocaleDateString("nl-NL", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

setInterval(updateClock, 1000);
updateClock();

async function loadWeather(id, lat, lon) {

    try {

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m`
        );

        const data = await response.json();

        document.getElementById(id).innerHTML =
        `
        🌡️ ${data.current.temperature_2m} °C<br>
        💨 ${data.current.wind_speed_10m} km/u
        `;

    } catch {

        document.getElementById(id).innerText =
        "Geen gegevens beschikbaar";
    }
}

loadWeather("weather-veendam",53.106,6.879);
loadWeather("weather-groningen",53.219,6.566);

</script>

</body>
</html>
