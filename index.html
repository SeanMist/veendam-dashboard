<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Veendam Operations Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@ss/bootstrap.min.css

<style>

body{
    background:#0d1117;
    color:#c9d1d9;
    overflow:hidden;
    height:100vh;
    margin:0;
}

.dashboard-header{
    background:#161b22;
    border-bottom:1px solid #30363d;
    padding:15px;
    text-align:center;
}

.carousel,
.carousel-inner,
.carousel-item{
    height:calc(100vh - 80px);
}

.slide-container{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card-dark{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:16px;
    width:100%;
    max-width:1200px;
    height:80vh;
}

.card-header{
    background:#21262d;
    border-bottom:1px solid #30363d;
    color:#58a6ff;
    font-size:1.7rem;
    font-weight:bold;
}

.card-body{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.clock{
    font-size:9rem;
    font-weight:bold;
}

.date{
    font-size:2.5rem;
}
