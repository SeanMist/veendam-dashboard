<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veendam Operations Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d1117;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    overflow:hidden;
}

.header{
    background:#161b22;
    border-bottom:1px solid #30363d;
    text-align:center;
    padding:15px;
}

.header h1{
    margin:0;
    color:#58a6ff;
}

.carousel,
.carousel-inner,
.carousel-item{
    height:calc(100vh - 72px);
}

.slide-wrapper{
    height:100%;
    padding:25px;
}

.dashboard-card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:16px;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.card-header-custom{
    padding:18px 25px;
    background:#21262d;
    color:#58a6ff;
    font-weight:bold;
    font-size:1.6rem;
    border-bottom:1px solid #30363d;
}

.card-content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
}

.flip-clock{
    display:flex;
    gap:12px;
    margin-bottom:25px;
}

.flip-box{
    background:#000;
    border-radius:10px;
    width:140px;
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    font-weight:bold;
    color:#58a6ff;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.date{
    font-size:34px;
}

.big-data{
    font-size:54px;
    line-height:1.7;
}

.kenteken{
    background:#f7d600;
    color:#000;
    padding:20px 50px;
    border-radius:10px;
    border:4px solid #000;
    font-size:90px;
    font-weight:bold;
