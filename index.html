<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veendam Operations Dashboard MVP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#ffffff;
    font-family:Segoe UI,Arial,sans-serif;
    overflow:hidden;
}

.header{
    height:70px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    justify-content:center;
    align-items:center;
}

.header h1{
    color:#58a6ff;
    font-size:28px;
}

.slide{
    display:none;
    height:calc(100vh - 70px);
    padding:20px;
}

.slide.active{
    display:block;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:16px;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.card-header{
    background:#21262d;
    color:#58a6ff;
    padding:18px 25px;
    font-size:28px;
    font-weight:bold;
    border-bottom:1px solid #30363d;
}

.card-body{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
    padding:30px;
}

.flip-clock{
    display:flex;
    gap:15px;
}

.flip{
    width:140px;
    height:170px;
    background:#000;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#58a6ff;
    font-size:90px;
    font-weight:bold;
}

.date{
    margin-top:30px;
    font-size:34px;
}

.big{
    font-size:48px;
    line-height:1.8;
}

.kenteken{
    background:#f4d000;
    color:#000;
    border:4px solid #000;
    border-radius:10px;
    padding:15px 40px;
    font-size:72px;
    font-weight:bold;
    letter-spacing:6px;
    margin-bottom:25px;
}

.progress-container{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:8px;
    background:#111;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#58a6ff;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div class="header">
    <h1>🚨 Veendam Operations Dashboard</h1>
</div>

<!-- SLIDE 1 -->

<div class="slide active">

    <div class="card">

        <div class="card-header">
            🕒 Klok
        </div>

        <div class="card-body">

            <div class="flip-clock">

                <div id="hh" class="flip">00</div>
                <div id="mm" class="flip">00</div>
                <div id="ss" class="flip">00</div>

            </div>

            <div id="date" class="date"></div>

        </div>

    </div>

</div>

<!-- SLIDE 2 -->

<div class="slide">

    <div class="card">

        <div class="card-header">
            🌦 Weer Veendam
        </div>

        <div class="card-body">

            <div id="weatherVeendam" class="big">
                Laden...
            </div>

        </div>

    </div>

</div>

<!-- SLIDE 3 -->

<div class="slide">

    <div class="card">

        <div class="card-header">
            🌤 Weer Groningen
        </div>

        <div class="card-body">

            <div id="weatherGroningen" class="big">
                Laden...
            </div>

        </div>

    </div>

</div>

<!-- SLIDE 4 -->

<div class="slide">

    <div class="card">

        <div class="card-header">
            📡 Radar Groningen
        </div>

        <iframe
        src="https://embed.windy.com/embed2.html?lat=53.22&lon=6.57&zoom=8&level=surface&overlay=radar">
        </iframe>

    </div>

</div>

<!-- SLIDE 5 -->

<div class="slide">

    <div class="card">

        <div class="card-header">
            🚘 RDW Laatste Kenteken
        </div>

        <div class="card-body">

            <div id="kenteken" class="kenteken">
                LADEN
            </div>

            <div id="rdwInfo" class="big">
                Gegevens laden...
            </div>

        </div>

    </div>

</div>

<div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
</div>

<script>

const slides = document.querySelectorAll(".slide");

let currentSlide = 0;
let progress = 0;

function showSlide(index){

    slides.forEach(slide => slide.classList.remove("active"));

    slides[index].classList.add("active");

}

setInterval(() => {

    progress++;

    document.getElementById("progressBar").style.width =
        progress + "%";

    if(progress >= 100){

        progress = 0;

        currentSlide++;

        if(currentSlide >= slides.length){
            currentSlide = 0;
        }

        showSlide(currentSlide);
    }

},100);

function updateClock(){

    const now = new Date();

    document.getElementById("hh").textContent =
        String(now.getHours()).padStart(2,"0");

    document.getElementById("mm").textContent =
        String(now.getMinutes()).padStart(2,"0");

    document.getElementById("ss").textContent =
        String(now.getSeconds()).padStart(2,"0");

    document.getElementById("date").textContent =
        now.toLocaleDateString("nl-NL",{
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        });
}

updateClock();
setInterval(updateClock,1000);

async function loadWeather(id,lat,lon){

    try{

        const response =
        await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,relative_humidity_2m`
        );

        const data = await response.json();

        document.getElementById(id).innerHTML = `
            🌡️ ${data.current.temperature_2m} °C<br>
            💨 ${data.current.wind_speed_10m} km/u<br>
            💧 ${data.current.relative_humidity_2m}% luchtvochtigheid
        `;

    }catch{

        document.getElementById(id).innerHTML =
        "Geen gegevens beschikbaar";

    }
}

loadWeather(
    "weatherVeendam",
    53.106,
    6.879
);

loadWeather(
    "weatherGroningen",
    53.219,
    6.566
);

async function loadRDW(){

    try{

        const response = await fetch(
        "https://opendata.rdw.nl/resource/m9d7-ebf2.json?$select=kenteken,merk,handelsbenaming,eerste_kleur&$where=voertuigsoort='Personenauto'&$order=datum_tenaamstelling DESC&$limit=1"
        );

        const data = await response.json();

        if(data.length){

            const voertuig = data[0];

            document.getElementById("kenteken").textContent =
                voertuig.kenteken || "ONBEKEND";

            document.getElementById("rdwInfo").innerHTML = `
                Merk: ${voertuig.merk || "-"}<br>
                Model: ${voertuig.handelsbenaming || "-"}<br>
                Kleur: ${voertuig.eerste_kleur || "-"}
            `;
        }

    }catch{

        document.getElementById("rdwInfo").innerHTML =
            "RDW gegevens niet beschikbaar";

    }
}

loadRDW();

</script>

</body>
</html>
